# Shared action GRPO (FlowGRPO-style) settings; a `task=` preset overrides these.
defaults:
- _self_
- data: null
- model: null
- task: null
output_dir: ./runs/grpo/${now:%Y-%m-%d}_${now:%H-%M-%S}
batch_size: 1
num_workers: 8
lr_scheduler_type: constant
learning_rate: 5.0e-05
lr_warmup_steps: 100
num_epochs: 1000000
max_steps: 20000
log_every: 5
save_every: 500
eval_every: 100
gradient_accumulation_steps: 1
mixed_precision: bf16
seed: 42
max_grad_norm: 1.0
weight_decay: 0.01
resume: null
grpo:
  target: action
  sample:
    group_size: 8
    num_inference_steps: 10
    infer_shift: null
    sample_noise_std: 0.1
    logprob_noise_std: null
    anneal_noise: true
    min_std: 0.001
    randn_clip: 5.0
    logprob_clamp_mode: relative
    logprob_clamp_width: 7.0
    final_action_clip: null
    sde_mode: rigorous
    noise_level: 0.1
    train_sde_steps: 3
    sde_exclude_last_step: false
    sde_step_indices: null
    merge_sde_window: false
  train:
    denoising_discount: 1.0
    adv_clip_lower_quantile: 0.0
    adv_clip_upper_quantile: 1.0
    adv_eps: 1.0e-08
    adv_global_std: true
    drop_zero_adv: true
    use_bc_loss: false
    bc_coeff: 0.1
    kl_beta: 50
    kl_type: x
    kl_dim_weights: null
    kl_horizon_weights: null
    ppo_clip_range: 0.005
    adv_clip_max: 5.0
    num_inner_epochs: 4
    rollout_buffer_batches: 1
    kl_gate:
      enabled: false
      delta: 0.0001
      asymmetric: false
  lora:
    enabled: true
    r: 16
    alpha: 32.0
    dropout: 0.0
    target_modules:
    - q
    - k
    - v
    - o
  reward:
    name: pdm
    metric_cache_path: ${oc.env:NAVSIM_METRIC_CACHE_PATH,./data/metric_cache_navtrain}
    proposal_time_horizon: 4.0
    proposal_interval: 0.1
    model_trajectory_interval: 0.5
    progress_weight: 10.0
    ttc_weight: 5.0
    comfortable_weight: 2.0
  eval:
    enabled: true
    num_batches: 8
  vis:
    enabled: true
    every: 100
    num_conditions: 2
    max_samples: 0
    plot_mode: bev_camera
    dpi: 150
wandb:
  enabled: false
  workspace: null
  project: simple-wam
  name: navsim_grpo
  group: null
  mode: online
hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
