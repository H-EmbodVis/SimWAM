# @package _global_
#
# SimWAM PhysicalAI front-camera training preset.
defaults:
  - override /data: physicalai
  - override /model: simwam_navsim
  - _self_

batch_size: 1
num_workers: 8

model:
  mot_checkpoint_mixed_attn: false

data:
  train:
    video_size: [384, 672]
    camera_layout: front

# scheduler
lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 15
max_steps: null
log_every: 10
save_every: 2000
eval_every: 2000

gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null
