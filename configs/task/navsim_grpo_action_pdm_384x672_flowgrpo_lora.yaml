# @package _global_
# NAVSIM reinforcement learning: FlowGRPO-style action LoRA fine-tuning.
#
# 384x672 front camera, 8 candidate trajectories per condition, 10 denoising steps
# of which 3 are stochastic (rigorous marginal-preserving SDE), PPO-clipped
# group-relative advantage against the compositional PDM reward, and a KL anchor to
# the frozen supervised policy. Only the action expert's LoRA adapters are trained.
defaults:
- override /data: navsim
- override /model: simwam_navsim
- _self_

batch_size: 1
num_workers: 8

model:
  _target_: simwam.runtime_grpo.create_simwam_grpo
  mot_checkpoint_mixed_attn: false
  # Supervised warm start. Override on the CLI or export SIMWAM_IL_CHECKPOINT.
  checkpoint_path: ${oc.env:SIMWAM_IL_CHECKPOINT,./weights/SimWAM.pt}

data:
  train:
    video_size: [384, 672]
    camera_layout: front
    trajectory_mode: absolute
    # RL focuses on the hard navtrain subset (supervised-model PDM score < 0.9).
    scene_filter: ${oc.env:NAVSIM_DEVKIT_ROOT}/navsim/planning/script/config/common/train_test_split/scene_filter/navtrain_pdm_score_below0p9.yaml

grpo:
  train:
    # Per-dimension KL anchor weights for [x, y, heading]: the longitudinal axis is
    # down-weighted so progress can improve while lateral/heading stay close to the
    # supervised policy.
    kl_dim_weights: [0.2, 1.0, 1.0]
