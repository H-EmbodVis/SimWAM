[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simwam"
version = "0.1.0"
description = "SimWAM training and FlowGRPO fine-tuning on NAVSIM"
requires-python = ">=3.10"
dependencies = [
  "accelerate==1.12.0",
  "av==16.0.1",
  "boto3==1.40.61",
  "einops==0.8.1",
  "huggingface-hub==0.29.2",
  "hydra-core==1.3.2",
  "imageio==2.37.0",
  "imageio-ffmpeg==0.6.0",
  "modelscope==1.34.0",
  "numpy==1.26.4",
  "omegaconf==2.3.0",
  "pillow==12.0.0",
  "rich==14.2.0",
  "safetensors==0.5.3",
  "scipy==1.13.1",
  "tensorboard>=2.15",
  "termcolor==2.5.0",
  "torchvision",
  "tqdm==4.66.5",
  "transformers==4.49.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["simwam*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
